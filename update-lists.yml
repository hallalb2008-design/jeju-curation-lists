name: 추천목록 자동 갱신

on:
  schedule:
    - cron: "17 18 * * 0"   # 매주 월요일 오전 3시 17분(한국시간)
  workflow_dispatch:         # Actions 화면에서 '지금 실행'
  push:
    paths:
      - "manual/**"          # 수동 목록 CSV를 올리면 바로 반영

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 목록 수집과 소장 확인
        env:
          NL_API_KEY: ${{ secrets.NL_API_KEY }}
          DATA4LIB_KEY: ${{ secrets.DATA4LIB_KEY }}
          MAX_CALLS: "450"
        run: python scripts/update_lists.py
      - name: 바뀐 내용 저장
        run: |
          git config user.name "curation-bot"
          git config user.email "curation-bot@users.noreply.github.com"
          git add data/lists.json
          git diff --cached --quiet || git commit -m "추천목록 갱신 $(date +%F)"
          git push
